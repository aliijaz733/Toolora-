async function saveFile(name,blob,msg){const dl=window.claude&&await window.claude.use('downloads');if(!dl)return say(msg,false,'Downloads are not available in this view. Open the page in a new tab and try again.');try{await dl.save({filename:name,data:blob});say(msg,true,'Download sent to your browser.');}catch(e){const m={declined:'Download was cancelled.',rate_limited:'Please wait a moment and try again.',too_large:'This file is too large to download here.'};say(msg,false,m[e&&e.code]||'Download is not available in this view.');}}

async function copyTo(text, id) {

const TOOLS = [ {slug:'image-to-pdf',name:'Image to PDF Converter',cat:'pdf',kw:'image to pdf converter jpg png webp convert photos document scan',desc:'Convert JPG, PNG and WebP images into one PDF with page size and margin options.',intro:'Convert several images into one PDF file. Choose a page size and margin, then download the finished PDF. Each image becomes one page.',art:`<svg viewBox='0 0 64 64' fill='none'><rect x='6' y='12' width='24' height='20' rx='4' fill='#22D3EE' opacity='.3'/><circle cx='15' cy='20' r='3' fill='#22D3EE'/><path d='M8 30l7-7 5 5 3-3 6 6z' fill='#22D3EE'/><path d='M34 24h6m-2.5-2.5 2.5 2.5-2.5 2.5' stroke='#3B82F6' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/><rect x='42' y='10' width='16' height='24' rx='3' fill='#3B82F6'/><path d='M46 18h8M46 22h8M46 26h5' stroke='#fff' stroke-width='1.8' stroke-linecap='round'/><rect x='14' y='38' width='36' height='16' rx='4' fill='#3B82F6' opacity='.18'/><text x='32' y='50' font-size='9' font-weight='800' text-anchor='middle' fill='#3B82F6' font-family='system-ui,sans-serif'>PDF</text></svg>`,html:`<label for='ii'>Choose images (JPG, PNG or WebP, up to 100 files)</label><input type='file' id='ii' accept='image/jpeg,image/png,image/webp' multiple><p class='muted' id='il'>No images selected.</p><div class='two'><div><label for='ps'>Page size</label><select id='ps'><option value='a4'>A4</option><option value='letter'>US Letter</option><option value='original'>Original image size</option></select></div><div><label for='pm'>Margin</label><select id='pm'><option value='0'>No margin</option><option value='20' selected>Small (20 pt)</option><option value='40'>Large (40 pt)</option></select></div></div><button class='btn' id='ib'>Create PDF</button><p class='err' id='msg' role='status'></p><button class='btn' id='idl' hidden>Download PDF</button>`,how:'Choose one or more images. JPG, PNG and WebP are supported. Each image becomes one page, in the order the files were picked. Choose a page size and margin, click Create PDF, then download the file. WebP images are converted automatically.',faq:[['Which image types can I convert?','JPG, PNG and WebP images up to 25 MB each. Other formats such as GIF or BMP are not supported yet.'],['What does Original image size do?','Each page is sized to its image, so the full image is kept without being forced onto a standard page size.'],['Are my images uploaded?','No. The PDF is created inside your browser and is only saved to your device when you click download.']],init(){const $=i=>document.getElementById(i);let imgs=[];const SIZES={a4:[595.28,841.89],letter:[612,792],original:null};const toPng=f=>new Promise((res,rej)=>{const u=URL.createObjectURL(f);const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0);URL.revokeObjectURL(u);c.toBlob(b=>b?b.arrayBuffer().then(res,rej):rej(new Error('encode')),'image/png');};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('read'));};im.src=u;});const embed=async(out,f)=>{if(f.type==='image/jpeg'){try{return await out.embedJpg(await f.arrayBuffer());}catch(e){}}if(f.type==='image/png'){try{return await out.embedPng(await f.arrayBuffer());}catch(e){}}return out.embedPng(await toPng(f));};$('ii').onchange=()=>{const all=[...$('ii').files];const ok=all.filter(f=>['image/jpeg','image/png','image/webp'].includes(f.type)&&f.size<=25*1048576);imgs=ok.slice(0,100);$('il').textContent=imgs.length?imgs.length+' image(s) selected: '+imgs.map(f=>f.name).join(', '):'No images selected.';$('idl').hidden=true;const msg=ok.length<all.length?'Some files were skipped. Only JPG, PNG and WebP up to 25 MB are supported.':ok.length>100?'Only the first 100 images will be used.':'';say('msg',!msg,msg);};$('ib').onclick=async()=>{if(!window.PDFLib)return say('msg',false,'The PDF engine did not load. Check your connection and refresh the page.');if(!imgs.length)return say('msg',false,'Choose at least one image.');try{say('msg',true,'Creating PDF...');const out=await PDFLib.PDFDocument.create();const sz=SIZES[$('ps').value],m=+$('pm').value;for(const f of imgs){const im=await embed(out,f);const pw=sz?sz[0]:im.width+2*m,ph=sz?sz[1]:im.height+2*m;const pg=out.addPage([pw,ph]);const sc=sz?Math.min((pw-2*m)/im.width,(ph-2*m)/im.height):1;const w=im.width*sc,h=im.height*sc;pg.drawImage(im,{x:(pw-w)/2,y:(ph-h)/2,width:w,height:h});}const data=await out.save();const d=$('idl');d._blob=new Blob([data],{type:'application/pdf'});d.hidden=false;say('msg',true,`Created a PDF with ${imgs.length} page(s).`);}catch(e){say('msg',false,'Could not create the PDF. One image may be damaged.');}};$('idl').onclick=()=>saveFile('image-to-pdf.pdf',$('idl')._blob,'msg');}}, {slug:'image-compressor',name:'Image Compressor',cat:'image',kw:'compress image reduce size jpg png webp photo smaller',desc:'Reduce JPG, PNG and WebP file size with a quality slider.',intro:'Make image files smaller right in your browser. Pick a quality level, compare the original and compressed images, then download the result.',art:`<svg viewBox='0 0 64 64' fill='none'><rect x='8' y='12' width='48' height='40' rx='8' fill='#3B82F6' opacity='.18'/><path d='M16 44l10-12 8 8 6-6 8 10z' fill='#3B82F6'/><circle cx='24' cy='24' r='4' fill='#22D3EE'/><path d='M40 18l-5 5m0-5v5h5M24 46l5-5m-5 0v5h5' stroke='#22D3EE' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/></svg>`,html:`<label for='file'>Choose an image (JPG, PNG or WebP, up to 25 MB)</label><input type='file' id='file' accept='image/jpeg,image/png,image/webp'><label for='qv'>Quality: <span id='qvv'>80</span>%</label><input type='range' id='qv' min='10' max='100' value='80'><label for='fmt'>Output format</label><select id='fmt'><option value='image/jpeg'>JPEG</option><option value='image/webp'>WebP</option></select><div class='metrics' id='im' aria-live='polite'></div><div { slug: "word-counter", name: "Word Counter", art: '<svg viewBox="0 0 64 64" fill="none"><rect x="10" y="8" width="36" height="46" rx="8" fill="#3B82F6" opacity=".18"/><rect x="16" y="18" width="24" height="4" rx="2" fill="#3B82F6"/><rect x="16" y="27" width="24" height="4" rx="2" fill="#3B82F6" opacity=".7"/><rect x="16" y="36" width="14" height="4" rx="2" fill="#3B82F6" opacity=".5"/><circle cx="46" cy="44" r="13" fill="#22D3EE"/><text x="46" y="48" font-size="11" font-weight="800" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif">123</text></svg>', cat: "text", icon: "🔤", kw: "word count characters sentences paragraphs reading time",
  desc: "Count words, characters, sentences, paragraphs and reading time.",
  intro: "Type or paste text to see live counts of words, characters, sentences and paragraphs, plus an estimated reading time.",
  html: `<label for="t">Your text</label><textarea id="t" rows="10" placeholder="Start typing or paste your text here…"></textarea>
<div class="metrics" id="m" aria-live="polite"></div>
<button class="btn" id="cp">Copy text</button><button class="btn ghost" id="cl">Clear</button><p class="err" id="msg" role="status"></p>`,
  how: "Type or paste text into the box and the counts update as you go. Copy text copies everything in the box, and Clear empties it. Reading time assumes about 200 words per minute.",
  faq: [["How are words counted?", "Words are separated by spaces or line breaks, so a hyphenated word such as well-known counts as one word."],
        ["How are characters counted?", "Characters are counted by Unicode code point, so accented letters and most non-Latin scripts count as one character each."]],
  init() {
    const t = document.getElementById('t'), m = document.getElementById('m');
    const stat = (l, v) => `<div class="metric"><b>${v}</b><span>${l}</span></div>`;
    const draw = () => {
      const s = t.value, w = s.trim() ? s.trim().split(/\s+/).length : 0;
      const sent = s.split(/[.!?]+/).filter(x => x.trim()).length;
      const para = s.split(/\n\s*\n/).filter(x => x.trim()).length;
      m.innerHTML = stat('Words', w.toLocaleString()) + stat('Characters', [...s].length.toLocaleString()) +
        stat('Characters (no spaces)', [...s.replace(/\s/g, '')].length.toLocaleString()) + stat('Sentences', sent) +
        stat('Paragraphs', para) + stat('Reading time', w ? Math.max(1, Math.round(w / 200)) + ' min' : '0 min');
    };
    t.addEventListener('input', draw); draw();
    document.getElementById('cp').onclick = () => copyTo(t.value, 'msg');
    document.getElementById('cl').onclick = () => { t.value = ''; draw(); say('msg', true, 'Cleared.'); };
  }
},

  how: "Paste your text, then press a case button and the text in the box is converted. Use Copy to copy the result, or Download .txt to save it. Clear empties the box.",

const card = t => `<a class="card" href="#/tool/${t.slug}"><div class="ctop"><span class="ico" aria-hidden="true">${t.art}</span><span class="arrow" aria-hidden="true">↗</span></div><h3>${t.name}</h3><p>${t.desc}</p><span class="tag">${CATS[t.cat][0]}</span></a>`;
const catCard = k => { const n = TOOLS.filter(t => t.cat === k).length;
  return `<a class="card" href="#/category/${k}"><span class="ico" aria-hidden="true">${CATS[k][1]}</span><h3>${CATS[k][0]}</h3><p>${CATS[k][2]} ${n ? n + ' tool' + (n > 1 ? 's' : '') : '<em>Coming in a later build.</em>'}</p></a>`; };
const chip = (k, l) => `<button class="chip" data-cat="${k}" aria-pressed="${state.cat === k}">${l}</button>`;
const dir = () => `<div class="chips">${chip('all', 'All')}${Object.keys(CATS).filter(k => TOOLS.some(t => t.cat === k)).map(k => chip(k, CATS[k][0])).join('')}</div><div class="grid" id="grid"></div><p class="muted" id="none" hidden></p>`;
const searchBox = () => `<label class="sr" for="q">Search tools</label><input type="search" id="q" placeholder="Search tools by name or keyword" autocomplete="off" style="margin-bottom:20px">`;
function tilt(e,el){const r=el.getBoundingClientRect();el.style.setProperty('--rx',((0.5-(e.clientY-r.top)/r.height)*16)+'deg');el.style.setProperty('--ry',(((e.clientX-r.left)/r.width-0.5)*20)+'deg')}
const scene = () => `<div class="scene" onpointermove="tilt(event,this)" onpointerleave="this.style.setProperty('--rx','0deg');this.style.setProperty('--ry','0deg')"><div class="glow"></div>${['word-counter','case-converter','json-formatter','percentage-calculator','age-calculator'].map((s, i) => { const t = TOOLS.find(x => x.slug === s); return `<a class="fcard fc${i + 1}" href="#/tool/${t.slug}">${t.art}<span>${t.name}</span></a>`; }).join('')}</div>`;
const faqHTML = arr => arr.map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join('');

function grid() {
  const q = state.q.trim().toLowerCase();
  const list = TOOLS.filter(t => (state.cat === 'all' || t.cat === state.cat) && (!q || (t.name + ' ' + t.kw + ' ' + t.desc).toLowerCase().includes(q)));
  const g = document.getElementById('grid'); if (!g) return;
  g.innerHTML = list.map(card).join('');
  const none = document.getElementById('none');
  const built = state.cat === 'all' || TOOLS.some(t => t.cat === state.cat);
  none.hidden = list.length > 0;
  none.textContent = !built ? 'Tools for this category are coming in a later build.' : 'No tools match your search. Try another keyword.';
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.cat === state.cat));
}

const view = (html, title) => { app.innerHTML = `<div class="wrap">${html}</div>`; document.title = title + ' – Toolora'; window.scrollTo(0, 0); };

  state = { cat: 'all', q: '' };
  const popular = ['word-counter', 'percentage-calculator', 'json-formatter', 'age-calculator'].map(s => TOOLS.find(t => t.slug === s));
  view(`<section class="hero"><span class="badge">Powerful Tools. Simple Solutions.</span><h1>Free Online Tools for Everyday Tasks</h1>
<p class="lead">Compress images, manage PDFs, format text, generate QR codes, and calculate results — all in one place.</p>

<section><h2>Popular tools</h2><div class="grid">${popular.map(card).join('')}</div></section>

function allTools() { state = { cat: 'all', q: '' };
  view(`<h1>All Tools</h1>${searchBox()}${dir()}`, 'All Tools'); grid(); }

function category(k) { state = { cat: k, q: '' };
  view(`<p class="crumb"><a href="#/">Home</a> / ${CATS[k][0]}</p><h1>${CATS[k][0]}</h1><p class="muted">${CATS[k][2]}</p>${searchBox()}${dir()}`, CATS[k][0]); grid(); }

function tool(t) {
  const related = TOOLS.filter(x => x !== t).sort((a, b) => (b.cat === t.cat) - (a.cat === t.cat)).slice(0, 3);
  view(`<p class="crumb"><a href="#/">Home</a> / <a href="#/category/${t.cat}">${CATS[t.cat][0]}</a> / ${t.name}</p>

function closeMenu() { document.getElementById('nav').classList.remove('open'); document.getElementById('menuBtn').setAttribute('aria-expanded', 'false'); }

function route() {
  closeMenu();
  const [a, b] = location.hash.replace(/^#\/?/, '').split('/');
  if (!a) return home();
  if (a === 'tools') return allTools();
  if (a === 'category' && CATS[b]) return category(b);
  if (a === 'tool') { const t = TOOLS.find(x => x.slug === b); if (t) return tool(t); }
  if (PAGES[a]) return view(`<h1>${PAGES[a][0]}</h1>${PAGES[a][1]}`, PAGES[a][0]);
  view(`<h1>Page not found</h1><p class="muted">The page you were looking for doesn't exist.</p><p><a href="#/">Go to the homepage</a></p>`, 'Page not found');
}

app.addEventListener('input', e => { if (e.target.id === 'q') { state.q = e.target.value; grid(); } });
app.addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) { state.cat = c.dataset.cat; grid(); } });
document.getElementById('menuBtn').onclick = () => {
  const open = document.getElementById('nav').classList.toggle('open');
  document.getElementById('menuBtn').setAttribute('aria-expanded', open);
};
window.addEventListener('hashchange', route);
route();
